[project]
name = "nightecho"
version = "0.1.0"
description = "Sleep research data preparation and sonar experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nightecho = "nightecho.cap:main"

[tool.setuptools.packages.find]
where = ["src"]
